---
- name: Installer Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Déployer le vhost
  ansible.builtin.template:
    src: portfolio.conf.j2
    dest: /etc/nginx/sites-available/portfolio.conf
    mode: "0644"
  notify: Reload nginx

- name: Activer le site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/portfolio.conf
    dest: /etc/nginx/sites-enabled/portfolio.conf
    state: link
  notify: Reload nginx

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Démarrer et activer Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Autoriser le port 80 dans le pare-feu
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
